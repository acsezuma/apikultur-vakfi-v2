<!doctype html><html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600&amp;family=Hanken+Grotesk:wght@500&amp;family=IBM+Plex+Mono:wght@500&amp;display=swap">
<style>
*{margin:0;box-sizing:border-box}
body{width:1200px;height:630px;overflow:hidden;background:#33261B;color:#F9EFE3;font-family:'Hanken Grotesk',sans-serif;position:relative}
.bg{position:absolute;inset:0;background:radial-gradient(900px 520px at 88% 110%,rgba(234,133,18,.22),rgba(234,133,18,0) 70%),radial-gradient(700px 420px at 105% -10%,rgba(184,38,24,.28),rgba(184,38,24,0) 70%)}
.wrap{position:relative;padding:74px 88px 84px;height:100%;display:flex;flex-direction:column}
.brand{display:flex;align-items:center;gap:22px}
.brand .name{font-family:'Outfit';font-weight:600;font-size:30px;letter-spacing:.14em}
h1{font-family:'Outfit';font-weight:600;font-size:76px;line-height:1.04;letter-spacing:-.015em;margin-top:auto}
h1 span{color:#EA8512}
.tag{margin-top:34px;display:flex;align-items:center;gap:18px;font-family:'IBM Plex Mono';font-weight:500;font-size:19px;letter-spacing:.18em;text-transform:uppercase;color:rgba(249,239,227,.72)}
.tag:before{content:"";width:56px;height:3px;background:#B82618}
</style></head><body><div class="bg"></div><div class="wrap">
<div class="brand"><img src="../../assets/logo-mark.png" alt="" style="height:60px;width:auto"><div class="name">APICULTURE FOUNDATION</div></div>
<h1>Building the future<br>of beekeeping, <span>together.</span></h1>
</div></body></html>
